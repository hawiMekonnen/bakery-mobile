plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.bluetoothprinter'
version = '1.0.0'

android {
  namespace "expo.modules.bluetoothprinter"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0"
}
